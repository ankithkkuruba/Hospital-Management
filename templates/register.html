{% extends "base.html" %}

{% block content %}

<style>

.register-container {
    max-width: 700px;
    margin: 40px auto;
}

.register-card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.register-header {
    text-align: center;
    margin-bottom: 30px;
}

.register-icon {
    width: 75px;
    height: 75px;
    background: #e8f3ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 35px;
}

.register-header h2 {
    margin-bottom: 5px;
    font-weight: 700;
}

.register-header p {
    color: #777;
}

.register-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
    color: #374151;
}

.form-group input,
.form-group select {
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #078bd0;
}

.register-btn {
    grid-column: 1 / -1;
    border: none;
    background: #078bd0;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.login-link a {
    color: #078bd0;
    font-weight: 600;
    text-decoration: none;
}

@media (max-width: 650px) {

    .register-form {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .register-btn {
        grid-column: auto;
    }

}

</style>


<div class="register-container">

    <div class="register-card">

        <div class="register-header">

            <div class="register-icon">
                👤
            </div>

            <h2>Patient Registration</h2>

            <p>
                Create your MediCare patient account
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="register-form">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        min="1"
                        max="120"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Create username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Patient Account
                </button>

            </div>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login here
            </a>

        </div>

    </div>

</div>

{% endblock %}
